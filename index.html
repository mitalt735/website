<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antonio Spagnuolo</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep:       #00152b;
            --bg-mid:        #00203f;
            --bg-card:       #002347;
            --bg-card-hover: #002d59;
            --border:        rgba(255, 203, 5, 0.15);
            --border-bright: rgba(255, 203, 5, 0.4);
            --maize:         #FFCB05;
            --maize-dim:     #c99d00;
            --maize-pale:    rgba(255, 203, 5, 0.1);
            --blue-dark:     #00274C;
            --text-primary:  #f0f4ff;
            --text-muted:    rgba(210, 225, 255, 0.55);
            --text-dim:      rgba(170, 195, 230, 0.35);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'DM Sans', sans-serif;
            font-weight: 300;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
        }

        body::after {
            content: '';
            position: fixed;
            top: -30%;
            right: -15%;
            width: 65%;
            height: 65%;
            background: radial-gradient(ellipse, rgba(255, 203, 5, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .page-wrapper {
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 30px 80px;
            position: relative;
            z-index: 1;
        }

        /* ── HEADER ── */
        header {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: end;
            margin-bottom: 70px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--border);
            animation: fadeUp 0.7s ease both;
        }

        .name-block::before {
            content: '';
            display: block;
            width: 36px;
            height: 3px;
            background: var(--maize);
            margin-bottom: 16px;
        }

        .name-block h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: clamp(2.4rem, 5.5vw, 4.5rem);
            line-height: 0.95;
            letter-spacing: -1px;
            color: var(--text-primary);
        }

        .name-block h1 span {
            display: block;
            color: var(--maize);
        }

        .name-block .tagline {
            margin-top: 14px;
            font-size: 0.82rem;
            color: var(--text-muted);
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .header-nav {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 10px 20px;
            border: 1px solid var(--border-bright);
            border-radius: 2px;
            color: var(--maize);
            text-decoration: none;
            font-size: 0.78rem;
            letter-spacing: 0.13em;
            text-transform: uppercase;
            font-weight: 500;
            transition: background 0.25s, border-color 0.25s, color 0.25s;
        }

        .nav-link:hover {
            background: var(--maize-pale);
            border-color: var(--maize);
            color: #fff;
        }

        .nav-link svg {
            width: 13px;
            height: 13px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        /* ── SECTION LABEL ── */
        .section-label {
            font-size: 0.7rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--maize);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ── GALLERY ── */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }

        .gallery-item {
            position: relative;
            background: var(--bg-card);
            overflow: hidden;
            cursor: pointer;
            aspect-ratio: 1;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.4s ease;
            filter: brightness(0.85) saturate(0.9);
        }

        .gallery-item:hover img {
            transform: scale(1.07);
            filter: brightness(1) saturate(1);
        }

        .gallery-item-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 20, 43, 0.78) 0%, transparent 55%);
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: flex-end;
            padding: 14px;
            z-index: 1;
        }

        .gallery-item:hover .gallery-item-overlay { opacity: 1; }

        .gallery-item::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 2px solid var(--maize);
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
            z-index: 2;
        }

        .gallery-item:hover::after { opacity: 0.45; }

        .gallery-item-caption {
            font-size: 0.74rem;
            color: rgba(255,255,255,0.88);
            letter-spacing: 0.04em;
        }

        .gallery-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: var(--text-dim);
            font-size: 0.88rem;
            letter-spacing: 0.05em;
            border: 1px dashed rgba(255,203,5,0.2);
        }

        /* ── MODAL ── */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 8, 18, 0.95);
            backdrop-filter: blur(8px);
        }

        .modal.open {
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        .modal img {
            max-width: 92vw;
            max-height: 88vh;
            object-fit: contain;
            border-radius: 2px;
            box-shadow: 0 0 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,203,5,0.2);
        }

        .modal-close {
            position: fixed;
            top: 20px;
            right: 24px;
            background: rgba(0, 39, 76, 0.85);
            border: 1px solid var(--border-bright);
            color: var(--maize);
            width: 44px;
            height: 44px;
            border-radius: 2px;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, border-color 0.2s;
            line-height: 1;
        }

        .modal-close:hover {
            background: var(--maize-pale);
            border-color: var(--maize);
        }

        /* ── FOOTER ── */
        footer {
            margin-top: 70px;
            padding-top: 26px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.73rem;
            color: var(--text-dim);
            letter-spacing: 0.07em;
        }

        footer .footer-name { color: var(--maize); opacity: 0.65; }

        /* ── ANIMATIONS ── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(22px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .gallery-section { animation: fadeUp 0.7s 0.12s ease both; }

        /* ── RESPONSIVE ── */
        @media (max-width: 900px) {
            .gallery-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 680px) {
            .page-wrapper { padding: 24px 14px 50px; }

            header {
                grid-template-columns: 1fr;
                gap: 20px;
                margin-bottom: 36px;
                padding-bottom: 22px;
            }

            .name-block h1 { font-size: clamp(2rem, 10vw, 3rem); }
            .name-block .tagline { margin-top: 10px; font-size: 0.75rem; }

            .header-nav { flex-direction: row; gap: 8px; }
            .nav-link { padding: 9px 14px; font-size: 0.72rem; }

            .gallery-grid { grid-template-columns: repeat(3, 1fr); gap: 3px; }
            .section-label { font-size: 0.66rem; margin-bottom: 14px; }

            footer { flex-direction: column; gap: 8px; text-align: center; margin-top: 40px; }

            .modal-close { width: 48px; height: 48px; top: 14px; right: 14px; }
        }

        @media (max-width: 400px) {
            .gallery-grid { grid-template-columns: repeat(2, 1fr); }
            .header-nav { width: 100%; }
            .nav-link { flex: 1; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="page-wrapper">

    <header>
        <div class="name-block">
            <h1>Antonio<span>Spagnuolo</span></h1>
            <p class="tagline">Photo Gallery</p>
        </div>
        <nav class="header-nav">
            <a href="#gallery" class="nav-link">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                Gallery
            </a>
            <a href="upload.html" class="nav-link">
                <svg viewBox="0 0 24 24"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
                Upload
            </a>
            <a href="news" class="nav-link">
                <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
                News
            </a>
        </nav>
    </header>

    <section class="gallery-section" id="gallery">
        <p class="section-label">Collection</p>
        <div class="gallery-grid" id="galleryGrid"></div>
    </section>

    <footer>
        <span class="footer-name">Antonio Spagnuolo</span>
        <span id="footerCount"></span>
    </footer>
</div>

<!-- Modal -->
<div class="modal" id="modal" onclick="closeModal()">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <img id="modalImg" src="" alt="">
</div>

<script>
    const defaultImages = [
            { src: 'https://i.ibb.co/F49K3qjR/IMG-1505-jpeg.jpg', alt: 'IMG_1505' },
            { src: 'https://i.ibb.co/kV3mGmsq/202-C6-DB5-AC0-D-4-FB9-931-D-E5671-AACDAE1-png.png', alt: '202C6DB5-AC0D-4FB9-931D-E5671AACDAE1' }
        ];

    function loadGallery() {
        const grid = document.getElementById('galleryGrid');
        const count = document.getElementById('footerCount');
        grid.innerHTML = '';

        if (defaultImages.length === 0) {
            grid.innerHTML = '<div class="gallery-empty">No photos yet — upload some to get started.</div>';
            count.textContent = '0 photos';
            return;
        }

        count.textContent = defaultImages.length + ' photo' + (defaultImages.length !== 1 ? 's' : '');

        defaultImages.forEach((image) => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.innerHTML = `
                <img src="${image.src}" alt="${image.alt || ''}" loading="lazy">
                <div class="gallery-item-overlay">
                    <span class="gallery-item-caption">${image.alt || ''}</span>
                </div>
            `;
            item.addEventListener('click', () => openModal(image.src));
            grid.appendChild(item);
        });
    }

    function openModal(src) {
        document.getElementById('modalImg').src = src;
        document.getElementById('modal').classList.add('open');
    }

    function closeModal() {
        document.getElementById('modal').classList.remove('open');
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    document.querySelectorAll('a[href^="#"]').forEach(a => {
        a.addEventListener('click', e => {
            e.preventDefault();
            document.querySelector(a.getAttribute('href'))?.scrollIntoView({ behavior: 'smooth' });
        });
    });

    document.addEventListener('DOMContentLoaded', loadGallery);
</script>

</body>
</html>
