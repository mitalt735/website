<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lukas Tonkin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255,255,255,0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .link-button {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(45deg, #42a5f5, #1e88e5);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .link-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            background: linear-gradient(45deg, #64b5f6, #42a5f5);
        }
        
        /* Gallery Section */
        .gallery-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            animation: fadeInUp 0.8s ease-out both;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .section-title {
            font-size: 2em;
            text-align: center;
            margin-bottom: 30px;
            color: #fff;
        }
        
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin: 0 auto;
            max-width: 1000px;
        }
        
        .gallery-item {
            position: relative;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
        }
        
        .gallery-item:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.4);
        }
        
        .gallery-item img {
            width: 100%;
            flex: 1;
            min-height: 0;
            aspect-ratio: 1;
            object-fit: cover;
            transition: transform 0.3s ease;
            display: block;
        }
        
        .gallery-item:hover img {
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal-content {
            max-width: 90%;
            max-height: 90%;
            margin: auto;
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }
        
        .close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        
        .close:hover {
            color: #64b5f6;
        }
        
        @media (max-width: 768px) {
            body { padding: 10px; }
            .gallery-section { padding: 30px 20px; border-radius: 15px; }
            .section-title { font-size: 1.8em; }
            .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
            .close { top: 10px; right: 20px; font-size: 30px; }
        }
    </style>
</head>
<body>
        <!-- Gallery Section -->
        <div class="gallery-section" id="gallery">
            <h2 class="section-title">Photo Gallery</h2>
            <div class="gallery-grid"></div>
        </div>
    </div>
    
    <!-- Modal for full-size images -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close">&times;</span>
        <img class="modal-content" id="modalImage">
    </div>
    
<script>
    const defaultImages = [
        ];

    function loadGallery() {
        const galleryGrid = document.querySelector('.gallery-grid');
        galleryGrid.innerHTML = '';

        defaultImages.forEach((image, index) => {
            const galleryItem = document.createElement('div');
            galleryItem.className = 'gallery-item';
            galleryItem.onclick = function() { openModal(this); };

            const caption = document.createElement('div');
            caption.textContent = image.alt || `Gallery Image ${index + 1}`;
            caption.style.textAlign = 'center';
            caption.style.padding = '8px';
            caption.style.fontSize = '14px';
            caption.style.fontWeight = 'bold';
            caption.style.background = 'rgba(0,0,0,0.5)';
            caption.style.color = 'white';

            const imgWrapper = document.createElement('div');
            imgWrapper.style.overflow = 'hidden';
            imgWrapper.style.flex = '1';
            imgWrapper.style.minHeight = '0';

            const img = document.createElement('img');
            img.src = image.src;
            img.alt = image.alt || `Gallery Image ${index + 1}`;
            img.loading = 'lazy';
            img.style.width = '100%';
            img.style.height = '100%';
            img.style.objectFit = 'cover';
            img.style.display = 'block';
            img.style.transition = 'transform 0.3s ease';

            galleryItem.addEventListener('mouseenter', () => img.style.transform = 'scale(1.1)');
            galleryItem.addEventListener('mouseleave', () => img.style.transform = 'scale(1)');

            imgWrapper.appendChild(img);
            galleryItem.appendChild(imgWrapper);
            galleryItem.appendChild(caption);
            galleryGrid.appendChild(galleryItem);
        });
    }

    function openModal(element) {
        const img = element.querySelector('img');
        if (img) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            modal.style.display = 'block';
            modalImg.src = img.src;
        }
    }

    function closeModal() {
        document.getElementById('imageModal').style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', loadGallery);
</script>
</body>
</html>
