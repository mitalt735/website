<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lukas Tonkin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255,255,255,0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }
        
        .hero-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            text-align: center;
            animation: fadeInUp 0.8s ease-out;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(45deg, #fff, #64b5f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .bio-text {
            font-size: 1.1em;
            line-height: 1.8;
            margin-bottom: 30px;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .links-section {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }
        
        .link-button {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(45deg, #42a5f5, #1e88e5);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .link-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            background: linear-gradient(45deg, #64b5f6, #42a5f5);
        }
        
        /* Life Stories Section */
        .stories-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            animation: fadeInUp 0.8s ease-out 0.1s both;
        }
        
        .section-title {
            font-size: 2em;
            text-align: center;
            margin-bottom: 30px;
            color: #fff;
        }
        
        .story-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border-left: 4px solid #42a5f5;
            transition: all 0.3s ease;
        }
        
        .story-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(5px);
        }
        
        .story-item:last-child {
            margin-bottom: 0;
        }
        
        .story-text {
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.6;
            font-size: 1.05em;
        }
        
        .story-placeholder {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-style: italic;
            padding: 40px 20px;
        }
        
        /* Gallery Section */
        .gallery-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }
        
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin: 0 auto;
            max-width: 1000px;
        }
        
        .gallery-item {
            position: relative;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            aspect-ratio: 1;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        .gallery-item:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.4);
        }
        
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .gallery-item:hover img {
            transform: scale(1.1);
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal-content {
            max-width: 90%;
            max-height: 90%;
            margin: auto;
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }
        
        .close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        
        .close:hover {
            color: #64b5f6;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            h1 {
                font-size: 2.5em;
                letter-spacing: 1px;
            }
            
            .hero-section,
            .stories-section,
            .gallery-section {
                padding: 30px 20px;
                border-radius: 15px;
            }
            
            .section-title {
                font-size: 1.8em;
            }
            
            .story-item {
                padding: 20px;
            }
            
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            
            .close {
                top: 10px;
                right: 20px;
                font-size: 30px;
                background: rgba(0, 0, 0, 0.5);
                width: 40px;
                height: 40px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 2em;
            }
            
            .bio-text {
                font-size: 1em;
            }
            
            .links-section {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }
            
            .link-button {
                width: 100%;
                max-width: 250px;
            }
            
            .section-title {
                font-size: 1.5em;
            }
            
            .story-item {
                padding: 15px;
            }
            
            .gallery-grid {
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Hero Section -->
        <div class="hero-section">
            <h1>Welcome</h1>
            <p class="bio-text">
                Lukas
            </p>
            <div class="links-section">
                <a href="#gallery" class="link-button">View Gallery</a>
                <a href="upload.html" class="link-button">Upload Photos</a>
            </div>
        </div>
        
        <!-- Life Stories Section -->
        <div class="stories-section" id="stories">
            <h2 class="section-title">Life Stories</h2>
            <div class="stories-container">
                <div class="story-placeholder">
                    I was walking down the stairs and i heard my Sister's boyfriend say "Keep Going", I then walked down a bit more and then heard her say "I can't", this was very sus and i wont want it to happen again.
                </div>
            </div>
        </div>
        
        <!-- Gallery Section -->
        <div class="gallery-section" id="gallery">
            <h2 class="section-title">Photo Gallery</h2>
            <div class="gallery-grid">
                <!-- Gallery items will be loaded dynamically -->
            </div>
        </div>
    </div>
    
    <!-- Modal for full-size images -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close">&times;</span>
        <img class="modal-content" id="modalImage">
    </div>
    
<script>

    const defaultImages = [

            { src: 'https://i.ibb.co/1fknHSY9/IMG-3992-jpeg.jpg', alt: 'gigglish' },
            { src: 'https://i.ibb.co/5XFNxyCc/IMG-3993-jpeg.jpg', alt: 'alchoholic x2' }
        ];

    // Load gallery
function loadGallery() {
    const galleryGrid = document.querySelector('.gallery-grid');
    galleryGrid.innerHTML = '';

    defaultImages.forEach((image, index) => {
        const galleryItem = document.createElement('div');
        galleryItem.className = 'gallery-item';
        galleryItem.onclick = function() { openModal(this); };

        // Create caption (ALT TEXT ABOVE IMAGE)
        const caption = document.createElement('div');
        caption.textContent = image.alt || `Gallery Image ${index + 1}`;
        caption.style.textAlign = 'center';
        caption.style.padding = '8px';
        caption.style.fontSize = '14px';
        caption.style.fontWeight = 'bold';
        caption.style.background = 'rgba(0,0,0,0.5)';
        caption.style.color = 'white';

        const img = document.createElement('img');
        img.src = image.src;
        img.alt = image.alt || `Gallery Image ${index + 1}`;
        img.loading = 'lazy';

        // Add caption first (so it appears above image)
        galleryItem.appendChild(caption);
        galleryItem.appendChild(img);

        galleryGrid.appendChild(galleryItem);
    });
}

    function openModal(element) {
        const img = element.querySelector('img');
        if (img) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            modal.style.display = 'block';
            modalImg.src = img.src;
        }
    }

    function closeModal() {
        document.getElementById('imageModal').style.display = 'none';
    }

    // Smooth scrolling
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
            e.preventDefault();
            const target = document.querySelector(this.getAttribute('href'));
            if (target) {
                target.scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });
            }
        });
    });

    // Load gallery on page load
    document.addEventListener('DOMContentLoaded', loadGallery);
</script>
</body>
</html>
