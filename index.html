<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lukas Tonkin</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep:       #0a110d;
            --bg-mid:        #0f1a12;
            --bg-card:       #131f16;
            --bg-card-hover: #172119;
            --border:        rgba(74, 130, 74, 0.18);
            --border-bright: rgba(100, 180, 100, 0.35);
            --green-1:       #2d6a2d;
            --green-2:       #3d8b3d;
            --green-accent:  #5aad5a;
            --green-bright:  #7ecf7e;
            --text-primary:  #e8f0e8;
            --text-muted:    rgba(200, 220, 200, 0.6);
            --text-dim:      rgba(160, 190, 160, 0.45);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'DM Sans', sans-serif;
            font-weight: 300;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Subtle noise texture overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
        }

        /* Radial glow in background */
        body::after {
            content: '';
            position: fixed;
            top: -20%;
            left: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(ellipse, rgba(45, 106, 45, 0.12) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .page-wrapper {
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 30px 80px;
            position: relative;
            z-index: 1;
        }

        /* ── HEADER ── */
        header {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: end;
            margin-bottom: 80px;
            padding-bottom: 32px;
            border-bottom: 1px solid var(--border);
            animation: fadeUp 0.7s ease both;
        }

        .name-block h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: clamp(2.8rem, 6vw, 5rem);
            line-height: 0.95;
            letter-spacing: -1px;
            color: var(--text-primary);
        }

        .name-block h1 span {
            display: block;
            color: var(--green-bright);
        }

        .name-block .tagline {
            margin-top: 16px;
            font-size: 0.95rem;
            color: var(--text-muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .header-nav {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 22px;
            border: 1px solid var(--border-bright);
            border-radius: 2px;
            color: var(--green-bright);
            text-decoration: none;
            font-size: 0.82rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-weight: 500;
            transition: background 0.25s, border-color 0.25s, color 0.25s;
        }

        .nav-link:hover {
            background: rgba(94, 173, 94, 0.1);
            border-color: var(--green-accent);
            color: #fff;
        }

        .nav-link svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        /* ── GALLERY ── */
        .section-label {
            font-size: 0.72rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--green-accent);
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
        }

        /* Feature: first item spans 2 cols */
        .gallery-item {
            position: relative;
            background: var(--bg-card);
            overflow: hidden;
            cursor: pointer;
            aspect-ratio: 1;
        }

        .gallery-item:first-child {
            grid-column: span 2;
            grid-row: span 2;
            aspect-ratio: unset;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                        filter 0.4s ease;
            filter: brightness(0.88) saturate(0.85);
        }

        .gallery-item:hover img {
            transform: scale(1.06);
            filter: brightness(1) saturate(1);
        }

        .gallery-item-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(10,17,13,0.7) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.35s ease;
            display: flex;
            align-items: flex-end;
            padding: 18px;
        }

        .gallery-item:hover .gallery-item-overlay {
            opacity: 1;
        }

        .gallery-item-caption {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.85);
            letter-spacing: 0.04em;
        }

        .gallery-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: var(--text-dim);
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            border: 1px dashed var(--border);
        }

        /* ── MODAL ── */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(6px);
            animation: fadeIn 0.25s ease;
        }

        .modal.open { display: flex; align-items: center; justify-content: center; }

        .modal img {
            max-width: 92vw;
            max-height: 88vh;
            object-fit: contain;
            border-radius: 2px;
            box-shadow: 0 0 80px rgba(0,0,0,0.6);
        }

        .modal-close {
            position: fixed;
            top: 24px;
            right: 30px;
            background: none;
            border: 1px solid var(--border-bright);
            color: var(--text-muted);
            width: 40px;
            height: 40px;
            border-radius: 2px;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, border-color 0.2s;
            line-height: 1;
        }

        .modal-close:hover { color: #fff; border-color: var(--green-accent); }

        /* ── FOOTER ── */
        footer {
            margin-top: 80px;
            padding-top: 30px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-dim);
            letter-spacing: 0.06em;
        }

        /* ── ANIMATIONS ── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .gallery-section { animation: fadeUp 0.7s 0.15s ease both; }

        /* ── RESPONSIVE ── */
        @media (max-width: 680px) {
            .page-wrapper { padding: 36px 18px 60px; }

            header {
                grid-template-columns: 1fr;
                gap: 28px;
                margin-bottom: 50px;
            }

            .header-nav {
                flex-direction: row;
                align-items: center;
            }

            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .gallery-item:first-child {
                grid-column: span 2;
                grid-row: span 1;
                aspect-ratio: 16/9;
            }

            footer { flex-direction: column; gap: 10px; text-align: center; }
        }
    </style>
</head>
<body>

<div class="page-wrapper">

    <header>
        <div class="name-block">
            <h1>Lukas<span>Tonkin</span></h1>
            <p class="tagline">Photo Gallery</p>
        </div>
        <nav class="header-nav">
            <a href="#gallery" class="nav-link">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                Gallery
            </a>
            <a href="upload.html" class="nav-link">
                <svg viewBox="0 0 24 24"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
                Upload
            </a>
        </nav>
    </header>

    <section class="gallery-section" id="gallery">
        <p class="section-label">Collection</p>
        <div class="gallery-grid" id="galleryGrid">
            <!-- populated by JS -->
        </div>
    </section>

    <footer>
        <span>Lukas Tonkin</span>
        <span id="footerCount"></span>
    </footer>
</div>

<!-- Modal -->
<div class="modal" id="modal" onclick="closeModal()">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <img id="modalImg" src="" alt="">
</div>

<script>
    const defaultImages = [
            { src: 'https://i.ibb.co/1tmCZQcL/IMG-1352-jpeg.jpg', alt: 'IMG_1352' }
        ];

    function loadGallery() {
        const grid = document.getElementById('galleryGrid');
        const count = document.getElementById('footerCount');
        grid.innerHTML = '';

        if (defaultImages.length === 0) {
            grid.innerHTML = '<div class="gallery-empty">No photos yet — upload some to get started.</div>';
            count.textContent = '0 photos';
            return;
        }

        count.textContent = defaultImages.length + ' photo' + (defaultImages.length !== 1 ? 's' : '');

        defaultImages.forEach((image, i) => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.innerHTML = `
                <img src="${image.src}" alt="${image.alt || ''}" loading="lazy">
                <div class="gallery-item-overlay">
                    <span class="gallery-item-caption">${image.alt || ''}</span>
                </div>
            `;
            item.addEventListener('click', () => openModal(image.src));
            grid.appendChild(item);
        });
    }

    function openModal(src) {
        const modal = document.getElementById('modal');
        document.getElementById('modalImg').src = src;
        modal.classList.add('open');
    }

    function closeModal() {
        document.getElementById('modal').classList.remove('open');
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeModal();
    });

    document.querySelectorAll('a[href^="#"]').forEach(a => {
        a.addEventListener('click', e => {
            e.preventDefault();
            document.querySelector(a.getAttribute('href'))?.scrollIntoView({ behavior: 'smooth' });
        });
    });

    document.addEventListener('DOMContentLoaded', loadGallery);
</script>

</body>
</html>
