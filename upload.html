<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Photos - Lukas Tonkin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            position: relative;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }
        
        .upload-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            text-align: center;
            animation: fadeInUp 0.8s ease-out;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #fff, #64b5f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .upload-area {
            border: 3px dashed rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 40px;
            margin: 30px 0;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .upload-area:hover,
        .upload-area.drag-over {
            border-color: #64b5f6;
            background: rgba(100, 181, 246, 0.1);
        }
        
        .upload-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
        
        .upload-text {
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        
        .upload-subtext {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.7);
        }
        
        #fileInput {
            display: none;
        }
        
        .button {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(45deg, #42a5f5, #1e88e5);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin: 10px;
            border: none;
            cursor: pointer;
            font-size: 1em;
        }
        
        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            background: linear-gradient(45deg, #64b5f6, #42a5f5);
        }
        
        .preview-section {
            display: none;
            margin-top: 30px;
        }
        
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        
        .preview-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 1;
        }
        
        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .preview-item .remove-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(255, 0, 0, 0.8);
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }
        
        .preview-item .remove-btn:hover {
            background: rgba(255, 0, 0, 1);
        }
        
        .status-message {
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        
        .status-message.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.5);
        }
        
        .status-message.error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid rgba(244, 67, 54, 0.5);
        }
        
        .info-box {
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid rgba(255, 193, 7, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin: 30px 0;
            text-align: left;
        }
        
        .info-box h3 {
            margin-bottom: 10px;
            color: #ffc107;
        }
        
        .info-box p {
            margin: 5px 0;
            font-size: 0.9em;
            line-height: 1.6;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .upload-section {
                padding: 30px 20px;
            }
            
            .preview-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="upload-section">
            <h1>Upload Photos</h1>
            
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">ð¸</div>
                <div class="upload-text">Drop photos here or click to browse</div>
                <input type="file" id="fileInput" multiple accept="image/*">
            </div>
            
            <div class="preview-section" id="previewSection">
                <h3>Selected Photos</h3>
                <div class="preview-grid" id="previewGrid"></div>
                <button class="button" onclick="uploadPhotos()">Upload to Gallery</button>
                <button class="button" onclick="clearSelection()">Clear Selection</button>
            </div>
            
            <div class="status-message" id="statusMessage"></div>
            
            <div style="margin-top: 30px;">
                <a href="index.html" class="button">Back to Gallery</a>
            </div>
        </div>
    </div>
    
    <script>
        let selectedFiles = [];
        
        // Initialize upload area
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewSection = document.getElementById('previewSection');
        const previewGrid = document.getElementById('previewGrid');
        const statusMessage = document.getElementById('statusMessage');
        
        // Click to select files
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });
        
        // File input change
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });
        
        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('drag-over');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            handleFiles(e.dataTransfer.files);
        });
        
        // Handle selected files
        function handleFiles(files) {
            const validFiles = Array.from(files).filter(file => {
                if (!file.type.startsWith('image/')) {
                    showStatus('Only image files are allowed', 'error');
                    return false;
                }
                if (file.size > 5 * 1024 * 1024) {
                    showStatus(`${file.name} is too large (max 5MB)`, 'error');
                    return false;
                }
                return true;
            });
            
            if (validFiles.length > 0) {
                selectedFiles = [...selectedFiles, ...validFiles];
                updatePreview();
            }
        }
        
        // Update preview
        function updatePreview() {
            if (selectedFiles.length > 0) {
                previewSection.style.display = 'block';
                previewGrid.innerHTML = '';
                
                selectedFiles.forEach((file, index) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const previewItem = document.createElement('div');
                        previewItem.className = 'preview-item';
                        previewItem.innerHTML = `
                            <img src="${e.target.result}" alt="${file.name}">
                            <button class="remove-btn" onclick="removeFile(${index})">Ã</button>
                        `;
                        previewGrid.appendChild(previewItem);
                    };
                    reader.readAsDataURL(file);
                });
            } else {
                previewSection.style.display = 'none';
            }
        }
        
        // Remove file from selection
        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updatePreview();
        }
        
        // Clear all selections
        function clearSelection() {
            selectedFiles = [];
            fileInput.value = '';
            updatePreview();
        }
        
        // Upload photos
        async function uploadPhotos() {
            if (selectedFiles.length === 0) {
                showStatus('No photos selected', 'error');
                return;
            }
            
            // Check if API key is configured
            if (IMGBB_API_KEY === 'YOUR_IMGBB_API_KEY') {
                showStatus('Please configure your ImgBB API key first! See instructions below.', 'error');
                return;
            }
            
            showStatus('Uploading photos to image host...', 'success');
            
            try {
                // Upload each image to ImgBB first to get shorter URLs
                const uploadedImages = [];
                
                for (let i = 0; i < selectedFiles.length; i++) {
                    const file = selectedFiles[i];
                    showStatus(`Uploading image ${i + 1} of ${selectedFiles.length}...`, 'success');
                    
                    // Upload to ImgBB
                    const imageUrl = await uploadToImgBB(file);
                    
                    uploadedImages.push({
                        src: imageUrl,
                        alt: file.name.replace(/\.[^/.]+$/, ""), // Remove file extension
                        uploadDate: new Date().toISOString()
                    });
                }
                
                showStatus('Saving to gallery...', 'success');
                
                // Now upload the URLs to our API
                const response = await fetch('/api/load', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ images: uploadedImages })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to save images to gallery');
                }
                
                const result = await response.json();
                console.log('Gallery update successful:', result);
                
                showStatus(`Successfully uploaded ${selectedFiles.length} photos!`, 'success');
                
                // Clear selection after successful upload
                setTimeout(() => {
                    clearSelection();
                    // Redirect to gallery after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'o.html';
                    }, 2000);
                }, 1000);
            } catch (error) {
                showStatus('Upload failed: ' + error.message, 'error');
                console.error('Upload error:', error);
            }
        }
        
        // ImgBB API key - configured and ready to use!
        const IMGBB_API_KEY = 'd78c0a0f2121c9246f775961d0cb0256';
        
        // Function to upload image to ImgBB
        async function uploadToImgBB(file) {
            
            // Convert file to base64 for ImgBB
            const base64 = await new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    // Remove the data:image/...;base64, prefix
                    const base64Data = e.target.result.split(',')[1];
                    resolve(base64Data);
                };
                reader.readAsDataURL(file);
            });
            
            // Upload to ImgBB
            const formData = new FormData();
            formData.append('key', IMGBB_API_KEY);
            formData.append('image', base64);
            formData.append('name', file.name);
            
            const response = await fetch('https://api.imgbb.com/1/upload', {
                method: 'POST',
                body: formData
            });
            
            if (!response.ok) {
                throw new Error(`ImgBB upload failed: ${response.status}`);
            }
            
            const data = await response.json();
            
            if (!data.success) {
                throw new Error(`ImgBB error: ${data.error?.message || 'Unknown error'}`);
            }
            
            // Return the direct image URL
            return data.data.url;
        }
        
        // Show status message
        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = `status-message ${type}`;
            statusMessage.style.display = 'block';
            
            setTimeout(() => {
                statusMessage.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
